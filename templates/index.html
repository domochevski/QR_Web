<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        input[type="text"] {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: #4a90d9; }
        button {
            padding: 0.6rem 1.2rem;
            background: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #357abd; }
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            color: #888;
            font-size: 0.9rem;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
            position: relative;
        }
        .drop-zone.dragover {
            border-color: #4a90d9;
            background: #eaf2fb;
            color: #4a90d9;
        }
        .drop-zone input[type="file"] {
            display: none;
        }
        .drop-zone .file-name {
            margin-top: 0.4rem;
            font-size: 0.85rem;
            color: #555;
        }
        .separator {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            color: #aaa;
            font-size: 0.85rem;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .separator::before { margin-right: 0.6rem; }
        .separator::after { margin-left: 0.6rem; }
        #result { min-height: 40px; }
        #result img {
            max-width: 256px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .error { color: #d9534f; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>

        <div class="drop-zone" id="drop-zone">
            <p>Drag & drop a text file here, or <strong>click to browse</strong></p>
            <input type="file" id="file-input" accept=".txt,.csv,.json,.xml,.md,.log,.html,.yml,.yaml,.cfg,.ini,.conf">
            <div class="file-name" id="file-name"></div>
        </div>

        <div class="separator">or type manually</div>

        <form id="qr-form">
            <input type="text" id="text-input" name="text" placeholder="Enter text or URL" required>
            <button type="submit">Generate</button>
        </form>
        <div id="result"></div>
    </div>
    <script>
        const form = document.getElementById('qr-form');
        const result = document.getElementById('result');
        const textInput = document.getElementById('text-input');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');

        // --- Drag & drop ---
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) readFile(file);
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) readFile(file);
        });

        function readFile(file) {
            if (file.size > 2953) {
                result.innerHTML = '<p class="error">File content too large for a QR code (max ~2953 bytes).</p>';
                fileName.textContent = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result.trim();
                textInput.value = text;
                fileName.textContent = file.name;
                generateQR(text);
            };
            reader.readAsText(file);
        }

        // --- QR generation ---
        async function generateQR(text) {
            if (!text) {
                result.innerHTML = '<p class="error">Please enter some text.</p>';
                return;
            }
            result.innerHTML = '<p>Generating...</p>';
            try {
                const resp = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'text=' + encodeURIComponent(text),
                });
                if (!resp.ok) {
                    const errText = await resp.text();
                    result.innerHTML = '<p class="error">' + errText + '</p>';
                    return;
                }
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                result.innerHTML = '<img src="' + url + '" alt="QR Code">';
            } catch (err) {
                result.innerHTML = '<p class="error">Something went wrong.</p>';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            generateQR(textInput.value.trim());
        });
    </script>
</body>
</html>
